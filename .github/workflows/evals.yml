name: Evals Gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-gate:
    name: Offline Eval Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The gate script only uses Node built-ins, so no `npm ci` is needed.
      # It runs only when a committed gate dataset exists; otherwise it skips
      # (exit 0) instead of failing the whole pipeline on missing data.
      - name: Run gate if dataset is committed
        env:
          # Override to point at a different committed dataset if desired.
          EVAL_GATE_DATASET: evals/datasets/splits/ci.jsonl
        run: |
          if [ -s "$EVAL_GATE_DATASET" ]; then
            echo "Running offline eval gate on $EVAL_GATE_DATASET"
            npm run evals:gate -- --input="$EVAL_GATE_DATASET"
          else
            echo "::notice::No committed gate dataset at $EVAL_GATE_DATASET — skipping eval gate."
            echo "To enable: commit a fully-judged dataset there (see evals/README.md)."
          fi
